# Portões de entrada. Nenhum deles é opcional: PR com falha aqui não entra.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: testes (inclui a suíte constitucional)
        run: npm test
      - name: allowlist de licenças (docs/licensing/excecoes.md)
        run: npm run licenses
      - name: SBOM (CycloneDX e SPDX, só dependências de produção)
        run: |
          npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
          npm sbom --omit dev --sbom-format spdx > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.*.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Conta pessoal: a gitleaks-action não exige licença. Em organização, exige GITLEAKS_LICENSE.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
