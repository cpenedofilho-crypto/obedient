# Portões de entrada. Nenhum deles é opcional: PR com falha aqui não entra.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: testes (inclui a suíte constitucional)
        run: npm test
      - name: allowlist de licenças (docs/licensing/excecoes.md)
        run: npm run licenses
      - name: SBOM (CycloneDX e SPDX, só dependências de produção)
        run: |
          npm sbom --omit dev --sbom-format cyclonedx > sbom.cdx.json
          npm sbom --omit dev --sbom-format spdx > sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: sbom.*.json

  # A mesma suíte do store, contra um Postgres de verdade (no job "check" ela roda no PGlite). Aqui as
  # transações concorrem de fato: execução única da proposta e cadeia de auditoria sob disputa.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: obedient-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: store-postgres e servidor contra Postgres 17
        env:
          OBEDIENT_TEST_DATABASE_URL: postgres://postgres:obedient-ci@localhost:5432/postgres
        run: node --import tsx --test "packages/store-postgres/src/**/*.test.ts" "packages/server/src/**/*.test.ts" "packages/integrations/src/**/*.test.ts"

  # O app num Chromium de celular: passkey pelo autenticador virtual, fila sem internet, service
  # worker, texto do agente nunca virando HTML, alvo de toque e acessibilidade (axe).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: app de ponta a ponta
        run: npm run test:e2e

  # App do Music Intelligence Engine (D31, F3): projeto Expo separado, com lockfile próprio. Tipos, testes
  # no Node (controlador, sensor BLE com rádio falso, mixer, cliente do Growth OS), licenças do lockfile do
  # app e o bundle de produção para Android e iOS (prova que o motor e o shim de node:crypto resolvem).
  app-musica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/musica
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/musica/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run licenses
      - name: bundle Android e iOS
        run: |
          npx expo export --platform android --output-dir dist-export/android
          npx expo export --platform ios --output-dir dist-export/ios

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Binário direto, e não a gitleaks-action: no primeiro push de um repositório a action monta o
      # intervalo "<primeiro commit>^..<último>", e o primeiro commit não tem pai (falhou assim no run 1).
      # Varre o histórico inteiro a cada execução; versão fixa e checksum conferido.
      - name: gitleaks (histórico inteiro)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "$base/$arquivo"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $arquivo\$" checksums.txt | sha256sum -c -
          tar xzf "$arquivo" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
