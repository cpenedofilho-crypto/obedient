# CLA obrigatório antes do primeiro PR externo (CLA.md). As assinaturas ficam no branch
# cla-signatures deste repositório.
#
# PR aberto pelo dono do repositório não passa pelo bot: o código dele já está coberto pelo
# instrumento de licença com a Casa de IA, e os commits feitos com Claude Code no ambiente dele saem
# com a identidade "Claude", que nunca assina nada. "claude" NÃO entra na allowlist de propósito: isso
# liberaria o PR de qualquer pessoa de fora que usasse a mesma ferramenta. De fora, o commit precisa
# estar no nome da pessoa (CONTRIBUTING.md).
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: >-
          (github.event_name == 'pull_request_target' && github.event.pull_request.user.login != github.repository_owner) ||
          (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.user.login != github.repository_owner &&
           (github.event.comment.body == 'recheck' || github.event.comment.body == 'Li o CLA e concordo com os termos.'))
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v0.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: cpenedofilho-crypto,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: Li o CLA e concordo com os termos.
          custom-notsigned-prcomment: Obrigado pela contribuição. Antes de revisar, precisamos que você aceite o CLA (CLA.md). Para aceitar, comente exatamente a frase abaixo.
